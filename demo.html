const MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
function formatDateRu(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return "«" + String(d.getDate()).padStart(2,"0") + "» " + MONTHS[d.getMonth()] + " " + d.getFullYear() + " г.";
}
function formatDateShort(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("ru-RU");
}
function esc(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

    "</style></head><body>" + body + "</body></html>";
}

function buildStudentsTable(students) {
  const rows = students.map((s,i) =>
    "<tr><td style='text-align:center'>"+(i+1)+"</td><td>"+esc(s.full_name)+"</td><td>"+esc(s.passport||"—")+"</td><td>"+esc(s.snils||"—")+"</td></tr>"
  ).join("");
  return "<table><thead><tr><th>№</th><th>ФИО</th><th>Паспорт</th><th>СНИЛС</th></tr></thead><tbody>"+rows+"</tbody></table>";
}
function buildListRows(students, ctx) {
  return students.map((s,i) =>
    "<tr><td style='text-align:center'>"+(i+1)+"</td><td>"+esc(s.full_name)+"</td><td>"+esc(ctx.group.program_title)+
    "</td><td style='text-align:center'>"+ctx.group.program_hours+"</td><td>"+
    formatDateShort(ctx.group.start_date)+"–"+formatDateShort(ctx.group.end_date)+"</td><td></td></tr>"
  ).join("");
}
function buildJournalRows(students) {
  return students.map((s,i) =>
    "<tr><td style='text-align:center'>"+(i+1)+"</td><td>"+esc(s.full_name)+
    "</td><td style='text-align:center'>V</td><td style='text-align:center'>V</td><td style='text-align:center'>V</td><td style='text-align:center'>V</td></tr>"
  ).join("");
}
function buildAttestationRows(students) {
  const scores = [96,88,92,85,90,78];
  return students.map((s,i) => {
    const sc = scores[i % scores.length];
    const g = sc >= 90 ? "5" : sc >= 75 ? "4" : "3";
    return "<tr><td style='text-align:center'>"+(i+1)+"</td><td>"+esc(s.full_name)+
      "</td><td style='text-align:center'>"+sc+"</td><td style='text-align:center'>"+g+"</td></tr>";
  }).join("");
}
function buildRegRows(students, ctx, orderNum) {
  return students.map((s,i) =>
    "<tr><td style='text-align:center'>"+(i+1)+"</td><td>Удостоверение о ПК</td><td>"+esc(ctx.group.program_title)+

  ).join("");
}

let seq = 100;
function nextNum(prefix) {
  seq += 1;
  return prefix + new Date().getFullYear() + "-" + String(seq).padStart(3,"0");
}

    company_kpp: (ctx.company&&ctx.company.kpp)||"", company_ogrn: (ctx.company&&ctx.company.ogrn)||"",
    company_address: (ctx.company&&ctx.company.address)||"", company_director: (ctx.company&&ctx.company.director)||"",
    contract_number: orderNum, contract_date: formatDateShort(today), contract_date_ru: formatDateRu(today),
    order_number: orderNum, order_date: formatDateShort(today), order_date_ru: formatDateRu(today),
    students_count: String(ctx.students.length),
    total_price: price ? price.toLocaleString("ru-RU",{minimumFractionDigits:2}) : "",
    total_price_words: price ? price.toLocaleString("ru-RU") + " руб." : "",

    students_table: buildStudentsTable(ctx.students),

    journal_rows: buildJournalRows(ctx.students),
    attestation_rows: buildAttestationRows(ctx.students),
    registration_rows: buildRegRows(ctx.students, ctx, orderNum),
  };
}

function renderTemplate(html, vars) {
  const raw = { students_table:1, students_list_rows:1, journal_rows:1, attestation_rows:1, registration_rows:1 };
  return html.replace(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g, function(m, key) {
    if (!(key in vars)) return m;
    const val = vars[key] == null ? "" : vars[key];
    return raw[key] ? val : esc(val);
  });
}

function generateDocument(ctx, docType, opts) {
  opts = opts || {};
  const tpl = TPL[docType];
  if (!tpl) throw new Error("Нет шаблона: " + docType);
  const prefix = docType.indexOf("order") >= 0 ? "УЦ-" : "";
  const documentNumber = opts.documentNumber || nextNum(prefix);
  const documentDate = opts.documentDate || new Date().toISOString().slice(0,10);
  const variables = buildVariables(ctx, {
    documentNumber: documentNumber,
    documentDate: documentDate,
    totalPrice: opts.totalPrice,
  });
  const html = renderTemplate(tpl, variables);
  const meta = DOC_TYPES.find(function(d){ return d.key === docType; });
  return {
    id: "doc-" + docType + "-" + Date.now() + "-" + Math.random().toString(36).slice(2,7),
    doc_type: docType,
    name: (meta ? meta.title : docType) + " № " + documentNumber,
    document_number: documentNumber,
    document_date: documentDate,
    html: html,
  };
}

function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k) {
    if (k === "className") e.className = attrs[k];
    else if (k === "onClick") e.onclick = attrs[k];
    else if (k === "innerHTML") e.innerHTML = attrs[k];
    else if (k === "disabled") e.disabled = !!attrs[k];
    else if (k === "value") e.value = attrs[k];
    else if (k === "type") e.type = attrs[k];
    else if (k === "srcDoc") e.srcdoc = attrs[k];
    else e.setAttribute(k, attrs[k]);
  });
  (children || []).forEach(function(c) {
    if (c == null) return;
    if (typeof c === "string") e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}

function downloadHtml(doc) {
  const blob = new Blob([doc.html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = doc.name.replace(/[^\w\u0400-\u04FF\- ]+/g, "_").slice(0, 80) + ".html";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function render() {
  const root = document.getElementById("root");
  root.innerHTML = "";
  const header = el("div", { className: "max-w-6xl mx-auto p-4 sm:p-6 space-y-4" }, [
    el("div", { className: "rounded-2xl border border-slate-200 bg-white p-5" }, [
      el("h1", { className: "text-xl font-semibold" }, ["Документы группы — генератор"]),
      el("p", { className: "text-sm text-slate-500 mt-1" }, [
        SAMPLE.group.name + " · " + SAMPLE.students.length + " учеников · " + SAMPLE.organization.name
      ]),
      el("div", { className: "mt-3 flex flex-wrap items-center gap-3" }, [
        el("label", { className: "text-sm flex items-center gap-2" }, [
          "Стоимость (₽):",
          (function(){
            const inp = el("input", { type: "number", className: "w-28 rounded-lg border border-slate-200 px-2 py-1 text-sm", value: String(state.price) });
            inp.oninput = function(){ state.price = Number(inp.value) || 0; };
            return inp;
          })()
        ]),
        el("button", {
          className: "px-4 py-2 rounded-xl text-sm font-medium bg-blue-600 text-white",
          onClick: function() {
            try {
              state.error = null;
              const generated = DOC_TYPES.map(function(t) {
                return generateDocument(SAMPLE, t.key, { totalPrice: state.price });
              });
              state.docs = generated.concat(state.docs);
              state.selected = generated[0] || null;
              render();
            } catch (e) {
              state.error = e.message || String(e);
              render();
            }
          }
        }, ["⚡ Сгенерировать весь пакет"]),
      ]),
      state.error ? el("div", { className: "mt-3 rounded-xl bg-red-50 border border-red-200 text-red-800 text-sm px-3 py-2" }, [state.error]) : null,
    ]),
    el("div", { className: "grid lg:grid-cols-2 gap-4" }, [
      el("div", { className: "rounded-2xl border border-slate-200 bg-white divide-y divide-slate-100" },
        [el("div", { className: "p-3 text-sm font-medium bg-slate-50" }, ["Типы документов"])].concat(
          DOC_TYPES.map(function(t) {
            return el("div", { className: "p-3 flex items-start justify-between gap-2" }, [
              el("div", { className: "min-w-0" }, [
                el("div", { className: "text-sm font-medium" }, [t.title]),
                el("div", { className: "text-xs text-slate-500" }, [t.hint]),
              ]),
              el("button", {
                className: "shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium bg-blue-600 text-white",
                onClick: function() {
                  try {
                    state.error = null;
                    const doc = generateDocument(SAMPLE, t.key, { totalPrice: state.price });
                    state.docs = [doc].concat(state.docs);
                    state.selected = doc;
                    render();
                  } catch (e) {
                    state.error = e.message || String(e);
                    render();
                  }
                }
              }, ["Сгенерировать"]),
            ]);
          })
        )
      ),
      el("div", { className: "space-y-3" }, [
        el("div", { className: "rounded-2xl border border-slate-200 bg-white" }, [
          el("div", { className: "p-3 text-sm font-medium bg-slate-50" }, ["Сгенерированные"]),
          state.docs.length === 0
            ? el("div", { className: "p-8 text-center text-sm text-slate-500" }, ["Пока пусто"])
            : el("div", { className: "divide-y divide-slate-100 max-h-80 overflow-auto" },
                state.docs.map(function(d) {
                  return el("button", {
                    className: "w-full text-left p-3 hover:bg-slate-50 " + (state.selected && state.selected.id === d.id ? "bg-blue-50" : ""),
                    onClick: function(){ state.selected = d; render(); }
                  }, [
                    el("div", { className: "text-sm font-medium truncate" }, [d.name]),
                    el("div", { className: "text-xs text-slate-500" }, [d.document_number + " · " + d.doc_type]),
                  ]);
                })
              ),
        ]),
        state.selected ? el("div", { className: "rounded-2xl border border-slate-200 bg-white p-4 space-y-3" }, [
          el("div", { className: "text-sm font-medium" }, [state.selected.name]),
          el("div", { className: "flex flex-wrap gap-2" }, [
            el("button", {
              className: "px-3 py-1.5 rounded-lg text-sm border border-slate-200 hover:bg-slate-50",
              onClick: function() {
                const w = window.open("", "_blank");
                if (w) { w.document.write(state.selected.html); w.document.close(); }
              }
            }, ["Открыть"]),
            el("button", {
              className: "px-3 py-1.5 rounded-lg text-sm border border-slate-200 hover:bg-slate-50",
              onClick: function(){ downloadHtml(state.selected); }
            }, ["Скачать HTML"]),
          ]),
          el("div", { className: "border border-slate-200 rounded-xl overflow-hidden h-72" }, [
            el("iframe", { title: "preview", className: "w-full h-full", srcDoc: state.selected.html }),
          ]),
        ]) : null,
      ]),
    ]),
  ]);
  root.appendChild(header);
}

try {
  render();
} catch (e) {
  document.getElementById("root").innerHTML =
    '<div style="padding:24px;color:#b91c1c;font-family:system-ui">' +
    "<h2>Ошибка загрузки</h2><pre>" + String(e && e.stack || e) + "</pre></div>";
}
  </script>
</body>
</html>
